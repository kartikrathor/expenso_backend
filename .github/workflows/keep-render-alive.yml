# Render Free instances sleep after ~15 minutes with no inbound traffic.
# An external ping every 10 minutes keeps the API warm without a paid plan.
# Uses ~720 of the 750 free instance hours/month (ok for one web service).
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl -fsS --retry 2 --retry-delay 8 --max-time 90 \
            "https://expenso-backend-f61z.onrender.com/health"
